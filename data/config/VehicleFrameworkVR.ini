[VehicleFrameworkVR]
#
# ---------------
# Live Reload:
# Any change to the file while the game is running will be detected and applied immediately.
# Vehicle profiles (JSON) are re-read each time a vehicle is spawned.
#
# -------------------------------------
# Input Binding:
# Controller bindings are a single, case-insensitive line: "<hand> <type> <button> [duration] [+modifier]".
# Examples: "none"; "offhand tap grip"; "primary longpress A"; "primary press trigger +grip".
# Guide: https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/input-binding.md


# ---------------- Vehicles ----------------

# Folder with the vehicle profiles (JSON), relative to the game folder.
sVehiclesFolder = Data\F4SE\Plugins\VehicleFrameworkVR\Vehicles

# Profile used by the test spawn (the test grenade and the binding below).
sTestVehicleProfile = sedan

# Spawn the test vehicle in front of you without the grenade (development shortcut). "none" disables it.
sSpawnTestVehicleBinding = primary longpress b

# Distance in meters in front of you where the shortcut spawns the vehicle.
fSpawnDistance = 6.0

# Diagnostic physics: drive force straight from the throttle, no tyre slip model. Separates tyre problems
# from camera problems.
bSimpleMode = false

# Engine call that applies the wheel forces: 0 = hknpWorld::ApplyBodyImpulseAt, 1 = bhkNPCollisionObject::ApplyPointImpulseAt
iImpulseApi = 0

# Collision layer the wheel rays use, and the layers a wheel ray goes through (invisible volumes, actors).
sWheelRayLayer = charController

# Collision layer of the vehicle body WHILE SOMEBODY DRIVES. ROCK hands and the player's own character controller do not collide with
# charController, so the hull around the cabin does not push the arms. Parked, the body keeps the layer the engine gave it and the
# player bumps into the car (empty = never change it).
sVehicleBodyLayer = charController

# Collision layer of the body WHILE PARKED (empty = the layer the engine gave it, normally clutterLarge). bipedNoCC is a layer the player's
# character controller does collide with, so you cannot walk through the parked car. Reloaded live: try static, props,
# clutter, trap, animStatic... to find the one the player's character controller cannot walk through.
sParkedBodyLayer = bipedNoCC
sWheelRayIgnoreLayers = actorZone, trigger, charController, biped, bipedNoCC, deadBip, nonCollidable, cameraSphere, projectileZone, gasTrap, avoidBox, collisionBox, acousticSpace, spellExplosion, water

# Release the world reference the engine's raycast keeps (prevents a leak per ray). Leave on.
bReleasePickWorldReference = true

# Wheel set a new vehicle starts with: stock (original wheels), offroad (4x4 wheels: taller, wider, lugged; the car rides higher and
# gets four-wheel drive) or beadlock (the same class with a bronze beadlock rim). Changing it while a car is out applies at once.
# Holding B first shows a menu of vehicles (the profiles listed here, up to 4, files in Vehicles\<name>.json), then, once the chosen
# vehicle is out, the wheel menu. bWheelMenuOnEnter also shows the wheel menu every time you get in.
sVehicleProfiles = sedan, pickup, rockboy, rusianmother
bWheelMenuAfterSpawn = true
sWheelSet = stock
bWheelMenuOnEnter = false

# Engine sound while you drive (synthesised, follows the engine rpm; each vehicle profile has its own voice in "engine.sound"). Volume 0..1; it is
# meant to stay in the background. It plays through Windows, not through the game's audio, so the game's volume sliders do not change it.
bExhaustSmoke = true
bEngineSound = true
fEngineVolume = 0.6


# ---------------- Driving ----------------

# Get in / get out / re-center the seat. Getting in: put your hand on a door handle (the hand icon shows and the controller ticks) and
# press A there; "suppress" keeps the game from jumping while your hand is on the handle. Away from the handles A does what it always does.
sEnterBinding = primary press a suppress
sExitBinding = offhand longpress b
# Open the trunk (saddlebags on the motorcycle): press A with your hand on the trunk point, the vehicle stopped and nobody driving. It shows the
# game's container menu; what does not fit in the vehicle's capacity goes back to you when you close it. Each vehicle model keeps its own trunk
# in the save game, so it is still full when the vehicle is spawned again.
sTrunkBinding = primary press a suppress
sRecenterBinding = primary tap thumbstick
# Headlights on/off (hold the right stick).
sLightsBinding = primary longpress thumbstick
# The head must also be within fEnterDistance meters of the driver's seat.
fEnterDistance = 2.5

# Handbrake: pull the stick down past this share of its travel (0..1) to lock the handbrake wheels while you hold it (0 = off).
# sHandbrakeStick: which stick, right (the primary hand's; the default) or left (the steering stick).
fHandbrakeStickThreshold = 0.7
sHandbrakeStick = right

# Seconds the camera glides from where you stand into the seat when you get in (0 = jump straight into the seat).
fEnterGlideSeconds = 0.4

# Third person camera: click the left stick to toggle. Distance behind the seat and height above it, in meters.
sThirdPersonBinding = offhand press thumbstick
fThirdPersonDistance = 11.0
fThirdPersonHeight = 3.5
# Third person: the right stick (left/right) orbits the camera around the car.
# Orbit speed in deg/s (0 disables) and seconds after releasing the stick before the camera returns behind the car (0 = stays).
fThirdPersonOrbitSpeed = 120.0
# Turn the orbit the other way round for the same stick direction (true by default; false = the direction of 0.1.69 and earlier).
bThirdPersonOrbitInvert = true
# Third person: the player's body stays in the driver's seat (true) instead of being hidden (false). Needs FRIK's API v2.3 or later.
bThirdPersonBodyInSeat = true
# The seated body follows the vehicle (it leans, climbs and rolls with it). Its legs: pose (bent into a seated pose), hide (collapsed into the hips,
# if the pose looks wrong) or none (standing, as FRIK makes them). Thighs fSeatThighAngleDeg from straight down toward the front, shins
# fSeatKneeAngleDeg back down at the knee, knees fSeatKneeSpreadDeg apart. Reloaded live.
sThirdPersonLegs = pose
fSeatThighAngleDeg = 80
fSeatKneeAngleDeg = 90
fSeatKneeSpreadDeg = 8
# The driver does not shoot: the weapon is holstered while you drive (first and third person) and drawn again when you get out, if it was out
# when you got in.
bHolsterWeaponWhileDriving = true
fThirdPersonRecenterDelay = 3.0
# Third person: the camera stops short of walls, rocks and the ground between it and the car (a ray from above the seat), fCameraCollisionMargin
# meters in front of what it hits and never closer than fCameraMinDistance. It comes in quickly and goes back out slowly. Reloaded live.
bCameraCollision = true
fCameraCollisionMargin = 0.3
fCameraMinDistance = 2.0
# Switching between first and third person slides the camera between the seat and the chase spot, both ways, over this many seconds
# (0 = cut straight over).
fCameraSwitchSeconds = 0.6

# Driving HUD: the speed (km/h) with the action (left) and weapon (right) icons, floating in front of you while you drive, in first and third
# person. fHudDistance: meters in front of the eyes; fHudDownAngle: degrees below the line of sight (so it does not cover the road); fHudScale:
# size; fHudFollowSeconds: how softly it follows your head (0 = rigidly). Reloaded live.
bHud = true
fHudDistance = 1.0
fHudDownAngle = 25
fHudScale = 1.0
fHudFollowSeconds = 0.2
# Third person: the panel stays in front of the chase camera (it does not swing with the car) and sits lower, out of the middle of the view.
fHudDistanceThirdPerson = 1.0
fHudDownAngleThirdPerson = 40

# Triggers and steering stick: dead zone (0..0.5) and response curve exponent (1 = linear, higher = finer near center).
fDeadzone = 0.08
fResponseCurve = 1.4


# ---------------- First-person camera ----------------

# Where the seat takes the vehicle pose from: 0 = the carrier node as the engine last synced it, 1 = the Havok body (newest physics state,
# the same one the model is drawn from). The node stopped following the body in one test session (the camera stood still while the car drove
# away), so 1 is the default.
iSeatPoseSource = 1

# When the driver is put in the seat: 0 = this plugin's frame update, 1 = FRIK's FrameBegin phase (falls back to 0 without FRIK).
iCameraUpdatePoint = 1

# Direction of the VR room rotation relative to the vehicle heading. Detected automatically on the first turns;
# set bAutoDetectYawSign = false to force fRoomYawSign (1 or -1).
fRoomYawSign = 1
bAutoDetectYawSign = true

# Vertical vibration filter on the seat height: cutoff in Hz (0 disables) and the most it may hold the camera off the seat, in meters.
fVerticalFilterHz = 4.0
fVerticalFilterMax = 0.04

# Turn the player's collision off while driving (restored when leaving), and the layer used for it.
bDisablePlayerCollision = true

# While driving, remove the gravity of the player's character controller and zero its velocity: the engine otherwise sinks the seated player
# about 1 cm every frame (more on slow frames), which shows as the camera and hands bobbing against the cabin.
bPlayerNoGravity = true
sDriverCollisionLayer = nonCollidable

# Draw the vehicle model where the engine really has the camera. The engine moves the camera only on its next update, one frame after the seat
# placed it, so the model (drawn at once) ran one frame of driving ahead of the eyes: ~30 cm at 60 km/h, varying with every frame time. It showed
# as the cabin jumping against the view and the camera sitting too far back at speed. On: the model follows the camera's real position.
bLockModelToCamera = true

# How many frames behind the placement of the seat the engine draws the camera: the model is drawn at the vehicle pose of that many frames ago.
# 1 = the engine moves the camera on its next update. If the camera still slides back in the cabin at speed, try 2, then 3. 0 = draw at the current pose.
iModelLagFrames = 1

# How much of the car's pitch and roll the cabin shows (0 = none, 1 = all). The head stays level with the world, so on bumps and bridges the whole cabin
# would rock in front of the eyes; small tilts are scaled by this, big ones (ramps, flips) are shown in full. Reloaded live.
fCabinTiltScale = 0.4

# Cars without a separate model (the car's own object is the model): the seat redraws the car's node itself, tilt-damped and in step with the eyes, like it does for
# cars with a separate model. OFF = leave the node to the engine (the cabin then rocks with the chassis and the camera trails it one step). Reloaded live.
bDrawBodyNode = true

# Diagnostic: while ON, records ~25 s of what the engine rendered with (VehicleFrameworkVR_probe.csv). Costs frame time; switch it on while driving, off when done.
bRenderProbe = false

# Keep the model's previous-frame transform (the temporal upscaler builds motion vectors from it) in step with the hand-moved model.
bModelPreviousWorld = true

# Block FRIK's Smooth Movement while driving (its position filter would lag the camera behind the car).
bBlockFrikSmoothMovement = true


# Self-righting: seconds the car must lie on its side or roof, nearly still, before it rolls back onto its wheels (0 = off).
fRightAfterSeconds = 3.0

# A vehicle that falls through the world (it finds ground above itself) is logged ("falling through the world") and, once it is more than
# fFallRecoverMeters below where it last rested on its wheels, put back there (0 = only log it). sParkedBodyLayer above is only used while the
# vehicle rests on its wheels; on its side or in the air it keeps the engine's own layer, which meets the terrain.
fFallRecoverMeters = 3.0

# Smooth motion: draw the car and the seat camera at a steady time fRenderDelayMs behind the physics (interpolated between
# physics steps). On by default: the car moves by the real frame time instead of by whole physics steps (1-3 per frame); it adds that much latency.
bRenderInterpolation = true
fRenderDelayMs = 12

# Seat camera height added to every vehicle's driverEye, in centimetres.
fEyeLiftCm = 15

# Multiplier on every vehicle's engine torque curve.
fTorqueScale = 1.3

# ---------------- Diagnostics ----------------

# Per-step CSV telemetry in Documents\My Games\Fallout4VR\F4SE\ (VehicleFrameworkVR_physics.csv and _camera.csv),
# capped at fTelemetryMaxMinutes per file; the files are replaced on each game start.
bTelemetry = true
fTelemetryMaxMinutes = 10

# Draw wheel rays, contact forces, the seat and the exit point in the world.
bDebugDraw = false

# Log the plugin's own cost per frame every 5 seconds (target: under 0.2 ms).
bCostReport = true

# Log the player's body every 2 seconds and whenever it changes, with or without a vehicle: whether its 3D is hidden, the radius of the bound the
# renderer culls it by, whether FRIK's skeleton is ready, and whether a vehicle, the seat or the get-in zones are active. For tracking down a body
# that disappears ("Player body:" lines in the log).
bLogPlayerBody = true

# Motorcycle diagnostics (vehicles with a "lean" block): one row per physics step in VehicleFrameworkVR_moto.csv with the lean and the target the
# stabiliser aims for, its torque and whether it ran out ("saturated"), the turn rates, the steering asked and given, and per wheel the ground
# (normal, collision layer), suspension and tyre forces; and "Moto:" log lines when the front wheel is in the air for more than 0.1 s, the lean
# passes 30 degrees or the yaw rate passes 90 deg/s. Read when the telemetry files are opened (game start).
bLogMotoDiag = true

# A physics step whose velocity change the vehicle model cannot explain (m/s) is the hull hitting something. It is logged ("IMPACT") with
# what is around the car, and written to the telemetry CSV (impact_dv). 0 = off.
fImpactLogMps = 2.0


# ---------------- Health ----------------

# The vehicle health system: the enemies' fire and the collisions damage the vehicle (its "damage" block in the profile JSON), the covered driver
# takes none of that fire, the cabin shields the driver from radiation while its reserve lasts ("radiation" block), a vehicle at zero health is
# disabled (no throttle, handbrake on, smoke) until it is repaired, and the driving HUD grows two rows of bars in the game's HUD colour: the
# vehicle's health and its radiation shielding, then the player's health (the rads in red from the right, as the game's HUD paints them) and
# action points. false = none of it (the vanilla game: the player takes the hits).
bVehicleHealth = true

# Multiplies every hit on the vehicle (collisions are not multiplied).
fVehicleDamageScale = 1.0

# Level scaling of the hits on the vehicle: damage x min(1 + fPlayerLevelFactor x (player level - 1), fPlayerLevelCap) x min(1 + fAttackerLevelFactor x
# (attacker level - 1), fAttackerLevelCap). At the defaults a level 50 player takes x1.98 and a level 60 attacker adds x1.59.
fPlayerLevelFactor = 0.02
fPlayerLevelCap = 3.0
fAttackerLevelFactor = 0.01
fAttackerLevelCap = 2.0

# What a hit's base damage is before the vehicle's multipliers, resistances and the level scaling: 0 = the weapon's (with its mods) or the
# explosion's own damage number, 1 = the damage the engine computed for the hit, with the attacker's perks and the target's resistances in it.
iVehicleDamageBase = 0

# The save game remembers each profile's health and radiation reserve; a vehicle spawned again from the same profile takes them over.
bRememberVehicleState = true

# Smoke from the bonnet while the vehicle is damaged (thin) or disabled (thick); uses the exhaust puff sprite.
bDamageSmoke = true

# Repair: with the vehicle parked, the hand at its repair point (the front of the bonnet, or damage.repair.point in the profile) and this binding
# held for damage.repair.seconds (3 s by default) gives back damage.repair.healthShare of the health and all the radiation reserve.
sRepairBinding = primary hold a suppress

# What protects the player in the driver's seat from the enemies' fire (with bVehicleHealth, in vehicles whose damage.occupantProtected is true):
# 0 = nothing, 1 = the game's own perk VFVR_DriverCover (in VehicleFrameworkVR_Vehicles.esp; given to the player the first time it is needed and
# kept by the save), whose entries multiply the incoming weapon and explosion damage by zero while the global VFVR_DriverCovered is 1, which the
# plugin sets while the driver is covered and clears on leaving the seat. The hits still land (and become vehicle damage) but take no health.
# Burning, poison and other damage that is neither a weapon's nor an explosion's is not covered.
iOccupantProtection = 1

# Log every hit on the player, by the player or on the vehicle ("HitProbe:" lines): who, with what, how much, and the hit flags.
bLogHitProbe = true

# Log the player's vitals every 2 seconds while driving (10 s otherwise) and whenever they change ("Vitals:" lines): health, action points,
# rads, radiation resistance, the cover perk's rank, the VFVR_DriverCovered global and god mode.
bLogVitals = true


[Debug]

# The level of log message to output; 2 - info (basic), 1 - debug (more logs), 0 - trace (A LOT of logs)
iLogLevel = 2

# Sets the spdlog output pattern for each normal log message.
# Examples: "%H:%M:%S.%e %l: %v"; "%H:%M:%S %L [%s:%#]: %v"
# Guide: https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/debug-config.md
sLogPattern = %H:%M:%S.%e %l: %v

# Mod-defined numeric scratch values for runtime experiments; blank values load as 0.
fFlowFlag1 = 0
fFlowFlag2 = 0
fFlowFlag3 = 0
# Mod-defined text scratch values; sFlowText1 also supplies haptictest sequences.
sFlowText1 =
sFlowText2 =

# Selects an in-game live-tuning target; none or blank disables it and restores controller input.
# Examples: flag123; haptictest
# Guide: https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/debug-config.md
sAdjustTarget = none

# Writes named game-state dumps to the mod log and removes each name after it runs.
# Examples: ui_tree; skelly, fp_skelly; geometry, pipboy, all_nodes
# Timing: perf_reset starts a perf window, then perf logs what each part of the frame cost since
# Guide: https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/debug-config.md
sDumpDataOnceNames =

# Runs a one-shot inventory add or dry run from an operation plus category filters.
# Examples: get, weapons, throwables; print, weapons:laser; print-all, armor:slot=torso|class=heavy
# Guide: https://github.com/ArthurHub/F4VR-CommonFramework/blob/main/docs/debug-config.md
sAddItemsOnceNames =

# In-world debug draw overlay: master switch, comma-separated channel names to skip (e.g. npc-detection),
# and a controller binding to enable/disable the overlay in-headset.
# HUD placement: center, center-left, center-right, center-top, center-top-left, center-top-right.
bDebugDrawEnabled = true
sDebugDrawToggleBinding = offhand longpress A
sDebugDrawDisabledChannels =
sDebugDrawHudPlacement = center-top-left

# Which implementation resolves the world depth that hides overlays behind the world.
# auto (shipped) | depthpass (count only depth-testing passes) | direct (never resample; wrong under
# an upscaler) | off (no occlusion at all - overlays draw on top). A support switch: leave on auto.
sSceneDepthStrategy = auto

# Investigate the scene-depth capture that hides overlays behind the world.
bSceneDepthDiagnostics = false

# Internal use for versioning
iVersion = 44
